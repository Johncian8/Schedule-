<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>download...</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
  </style>
</head>

<body>

  <button>Download</button>

  <script>
  
  let btn = document.querySelector('button')
  
  btn.onclick = ()=>{
    
    let link = document.createElement('a')
    
    link.href = "https://github.com/Johncian8/Schedule-/blob/f7b8ad519c0e9cda9a166477e7889dadcb993d1b/ccit-logo.png"
    
    link.download = "ccit-logo.png"
    
    document.body.appendChild(link)
    link.click()
    document.body.removeChild(link)
    
  }
    
  </script>

</body>

</html>
